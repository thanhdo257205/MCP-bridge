name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Validate release tag and manifests
        run: node dist/scripts/release-check.js
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Validate release tag and manifests
        run: node dist/scripts/release-check.js
      # prepublishOnly runs the full test suite again on the publishing runner.
      # Authentication uses OIDC; do not add NODE_AUTH_TOKEN or an npm secret.
      - run: npm publish --access public
